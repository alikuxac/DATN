name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - "apps/native/**"
      - "package.json"
      - "yarn.lock"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/native

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🔧 Setup Eas CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: |
          cd ../..
          corepack enable
          yarn install --immutable

      - name: 🚀 Build APK
        run: eas build --platform android --profile apk --local --non-interactive --no-wait
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://doan-api.alikuxac.xyz' }}
          EXPO_PUBLIC_VIETMAP_API_KEY: ${{ secrets.EXPO_PUBLIC_VIETMAP_API_KEY }}
          # Creates a .env file locally for the build process if needed, 
          # though EAS CLI usually injects EXPO_PUBLIC_ vars automatically.

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/native/android/app/build/outputs/apk/release/*.apk
