version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: datn-redis
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    networks:
      - datn-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    command: redis-server --appendonly yes
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  api:
    # Pull from GitHub Container Registry
    # Replace <username> and <repo> with your GitHub username and repository name
    image: ghcr.io/alikuxac/datn/api:latest
    
    container_name: datn-api
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    # Use .env file for environment variables
    env_file:
      - .env
    
    volumes:
      # Mount JWT keys (if using file-based keys)
      - ./keys:/apps/keys:ro
    
    networks:
      - datn-network
    
    depends_on:
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datn-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
